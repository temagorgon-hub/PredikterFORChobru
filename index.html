<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChemSpace - Supabase Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: var(--tg-theme-secondary-bg-color, #ebedf0); --app-bg: var(--tg-theme-bg-color, #ffffff); 
            --text-main: var(--tg-theme-text-color, #000000); --text-muted: var(--tg-theme-hint-color, #8e8e93); 
            --primary: var(--tg-theme-button-color, #007aff); --danger: #ff3b30;
            --border: rgba(142, 142, 147, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); display: flex; justify-content: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; height: 100vh; background: var(--app-bg); color: var(--text-main); display: flex; flex-direction: column; position: relative; }
        .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--app-bg); z-index: 10; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .tg-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; }
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(var(--app-bg), 0.85); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 10px 24px; z-index: 10; display: none; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; cursor: pointer; border: none; background: transparent; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-size: 15px; outline: none; margin-bottom: 12px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 8px;}
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }
        .card { background: var(--app-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--app-bg); width: 100%; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: 0.3s; }
        .modal-overlay.show .modal-content { transform: translateY(0); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🧪 ChemSpace</h1>
        <div style="display:flex; gap: 8px; align-items:center;">
            <span id="tg-name-header" style="font-size:13px; font-weight:600;">...</span>
            <div class="tg-avatar" id="tg-avatar-header">?</div>
        </div>
    </div>
    
    <div class="content">
        <!-- Экраны регистрации -->
        <div class="view-section active" id="view-welcome">
            <h2 style="text-align: center; margin-bottom:20px;">Кто вы?</h2>
            <button class="btn btn-outline" onclick="showView('view-auth-student')">👨‍🎓 Я Ученик</button>
            <button class="btn btn-outline" onclick="showView('view-auth-teacher')">👨‍🏫 Я Учитель</button>
        </div>

        <div class="view-section" id="view-auth-teacher">
            <h2>Доступ учителя</h2>
            <input type="password" id="admin-pass" placeholder="Секретный пин-код (890135)">
            <button class="btn" onclick="registerTeacher()">Войти</button>
        </div>

        <div class="view-section" id="view-auth-student">
            <h2>Вход в дневник</h2>
            <select id="s-grade-login">
                <option value="8">8 класс</option><option value="9">9 класс</option>
                <option value="10">10 класс</option><option value="11">11 класс</option>
            </select>
            <input type="text" id="s-name-login" placeholder="Ваша Фамилия и Имя">
            <button class="btn" onclick="registerStudent()">Связать с Telegram</button>
        </div>

        <!-- Учитель: Задания -->
        <div class="view-section" id="view-teacher-tasks">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
                <h2>Задания</h2>
                <select id="t-view-grade" onchange="loadTasks()" style="width: auto; margin:0; padding: 8px;">
                    <option value="8">8 класс</option><option value="9">9 класс</option><option value="10">10 класс</option><option value="11">11 класс</option>
                </select>
            </div>
            <div id="t-tasks-list">Загрузка из Supabase...</div>
            <button class="btn" style="position:fixed; bottom: 80px; width: calc(100% - 40px);" onclick="document.getElementById('add-modal').classList.add('show')">➕ Новое задание</button>
        </div>

        <!-- Ученик: Задания -->
        <div class="view-section" id="view-student-tasks">
            <h2 style="margin-bottom: 16px;">Мои задания</h2>
            <div id="s-tasks-list">Загрузка из Supabase...</div>
        </div>

        <!-- Профиль -->
        <div class="view-section" id="view-profile">
            <h2 style="margin-bottom: 16px;">Мой профиль</h2>
            <div class="card" style="text-align: center;">
                <h3 id="profile-name">Имя</h3>
                <p id="profile-role" style="color: var(--text-muted); margin-bottom: 16px;">Роль</p>
                <button class="btn btn-danger" onclick="logout()">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <!-- Навигация -->
    <div class="bottom-nav" id="nav-teacher">
        <button class="nav-item active" onclick="switchNav('teacher', 'tasks', this)">📚 Задания</button>
        <button class="nav-item" onclick="switchNav('teacher', 'profile', this)">👤 Профиль</button>
    </div>
    <div class="bottom-nav" id="nav-student">
        <button class="nav-item active" onclick="switchNav('student', 'tasks', this)">📝 Мои ДЗ</button>
        <button class="nav-item" onclick="switchNav('student', 'profile', this)">👤 Профиль</button>
    </div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-content">
        <h3 style="margin-bottom:12px;">Новое задание</h3>
        <select id="t-grade-modal"><option value="8">8 класс</option><option value="9">9 класс</option><option value="10">10 класс</option><option value="11">11 класс</option></select>
        <input type="text" id="t-target-modal" placeholder="Кому (Имя или напишите Все)">
        <textarea id="t-text" placeholder="Текст задания..."></textarea>
        
        <label class="btn btn-outline" style="cursor: pointer; text-align:center;">
            <input type="file" id="t-file-input" style="display: none;" onchange="handleFileSelect(event)">
            📎 Выбрать файл (до 50 МБ)
        </label>
        <div id="t-file-preview" style="margin-bottom: 16px; font-size:13px; color:var(--primary); text-align:center;"></div>

        <button class="btn" id="publish-btn" onclick="addHW()">🚀 Опубликовать</button>
        <button class="btn btn-outline" style="border:none;" onclick="document.getElementById('add-modal').classList.remove('show')">Отмена</button>
    </div>
</div>

<script>
    // ==========================================
    // ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE И ТЕЛЕГРАМ
    // ==========================================
    const SUPABASE_URL = 'https://vacnvdgsvsxbvkmynnjm.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_q5cQZKut7nFiDHaGt8kJZQ_Q3nsJ5Kg';
    const BOT_TOKEN = '8682198959:AAEBVQIZJJT90fA4bgxDtL8plJ6LWV6STeU';
    // ==========================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    const tgUser = tg.initDataUnsafe?.user || { id: "12345", first_name: "Тест" };
    document.getElementById('tg-name-header').innerText = tgUser.first_name;
    document.getElementById('tg-avatar-header').innerText = tgUser.first_name.charAt(0);

    let currentUser = null;
    let pendingFile = null;

    // --- Авторизация ---
    async function checkAutoLogin() {
        const { data, error } = await supabase.from('users').select('*').eq('tg_id', tgUser.id.toString()).single();
        if (data) {
            currentUser = data;
            initAppUI();
        } else {
            showView('view-welcome');
        }
    }

    function showView(id) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function initAppUI() {
        document.getElementById('profile-name').innerText = currentUser.name || "Учитель";
        document.getElementById('profile-role').innerText = currentUser.role === 'teacher' ? "Преподаватель" : `${currentUser.grade} класс`;

        document.getElementById('nav-teacher').style.display = currentUser.role === 'teacher' ? 'flex' : 'none';
        document.getElementById('nav-student').style.display = currentUser.role === 'student' ? 'flex' : 'none';
        
        switchNav(currentUser.role, 'tasks', document.querySelector(`#nav-${currentUser.role} .nav-item`));
        loadTasks();
        setupRealtime();
    }

    function switchNav(role, tab, el) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        if(el) el.classList.add('active');
        showView(`view-${role === 'teacher' && tab === 'profile' ? 'profile' : role + '-' + tab}`);
        if(tab === 'profile') showView('view-profile');
    }

    async function registerTeacher() {
        if(document.getElementById('admin-pass').value === '890135') {
            const user = { tg_id: tgUser.id.toString(), role: 'teacher', name: 'Учитель' };
            await supabase.from('users').insert([user]);
            currentUser = user;
            initAppUI();
        } else tg.showAlert("Неверный пин-код!");
    }

    async function registerStudent() {
        const grade = document.getElementById('s-grade-login').value;
        const name = document.getElementById('s-name-login').value.trim();
        if(!name) return;
        const user = { tg_id: tgUser.id.toString(), role: 'student', name: name, grade: grade };
        await supabase.from('users').insert([user]);
        currentUser = user;
        initAppUI();
    }

    async function logout() {
        await supabase.from('users').delete().eq('tg_id', tgUser.id.toString());
        window.location.reload();
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if(!file) return;
        pendingFile = file;
        document.getElementById('t-file-preview').innerText = `Выбран: ${file.name}`;
    }

    // --- Логика заданий ---
    async function addHW() {
        const text = document.getElementById('t-text').value.trim();
        const grade = document.getElementById('t-grade-modal').value;
        const target = document.getElementById('t-target-modal').value.trim() || 'Все';
        if(!text && !pendingFile) return tg.showAlert("Заполните задание!");

        const btn = document.getElementById('publish-btn');
        btn.innerText = "⏳ Загрузка...";
        btn.disabled = true;

        let fileUrl = null;
        let fileName = null;

        if (pendingFile) {
            const uniqueName = `${Date.now()}_${pendingFile.name}`;
            const { data, error } = await supabase.storage.from('homework_files').upload(uniqueName, pendingFile);
            if(data) {
                const { data: publicData } = supabase.storage.from('homework_files').getPublicUrl(uniqueName);
                fileUrl = publicData.publicUrl;
                fileName = pendingFile.name;
            }
        }

        const newTask = {
            grade: grade, target_name: target, text: text,
            date: new Date().toLocaleDateString('ru-RU'),
            timestamp: Date.now(), file_url: fileUrl, file_name: fileName,
            completed_by: []
        };

        await supabase.from('homeworks').insert([newTask]);

        // Рассылка через бота
        const { data: students } = await supabase.from('users').select('tg_id, name').eq('role', 'student').eq('grade', grade);
        if(students) {
            const sms = `📢 <b>Новое ДЗ!</b>\n\nКласс: ${grade}\nЗадание: ${text}`;
            students.forEach(u => {
                if(target === 'Все' || target === u.name) {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ chat_id: u.tg_id, text: sms, parse_mode: 'HTML' })
                    });
                }
            });
        }

        document.getElementById('t-text').value = '';
        pendingFile = null;
        document.getElementById('t-file-preview').innerText = '';
        document.getElementById('add-modal').classList.remove('show');
        btn.innerText = "🚀 Опубликовать";
        btn.disabled = false;
        tg.showAlert("Опубликовано!");
    }

    async function loadTasks() {
        if(!currentUser) return;
        const targetGrade = currentUser.role === 'teacher' ? document.getElementById('t-view-grade').value : currentUser.grade;
        const listId = currentUser.role === 'teacher' ? 't-tasks-list' : 's-tasks-list';
        
        let { data: tasks, error } = await supabase
            .from('homeworks')
            .select('*')
            .eq('grade', targetGrade)
            .order('timestamp', { ascending: false });

        if (error) return console.error(error);

        const filtered = currentUser.role === 'teacher' ? tasks : tasks.filter(t => t.target_name === 'Все' || t.target_name === currentUser.name);

        document.getElementById(listId).innerHTML = filtered.map(hw => {
            const doneArr = hw.completed_by || [];
            const isDone = currentUser.role === 'student' ? doneArr.includes(currentUser.name) : false;
            const fileHtml = hw.file_url ? `<a href="${hw.file_url}" target="_blank" style="display:block; background:rgba(0,122,255,0.1); color:var(--primary); padding:10px; border-radius:8px; text-decoration:none; margin-bottom:12px; font-weight:bold;">⬇ Скачать: ${hw.file_name}</a>` : '';

            if (currentUser.role === 'teacher') {
                return `<div class="card">
                    <div style="font-weight:bold; margin-bottom:8px;">Кому: ${hw.target_name} <span style="float:right; font-size:12px; font-weight:normal; color:gray;">${hw.date}</span></div>
                    <div style="margin-bottom: 12px;">${hw.text}</div>
                    ${fileHtml}
                    <div style="color:gray; font-size:13px; border-top:1px solid #eee; padding-top:8px;">Сдали: ${doneArr.join(', ') || 'Никто'}</div>
                    <button class="btn btn-danger" style="padding:8px; margin-top:8px;" onclick="deleteHW(${hw.id})">Удалить</button>
                </div>`;
            } else {
                return `<div class="card" style="opacity: ${isDone ? '0.7' : '1'}">
                    <div style="font-weight:bold; margin-bottom:8px;">${hw.target_name === 'Все' ? 'Общее задание' : 'Тебе'} <span style="float:right; font-size:12px; font-weight:normal; color:gray;">${hw.date}</span></div>
                    <div style="margin-bottom: 12px; ${isDone ? 'text-decoration:line-through;' : ''}">${hw.text}</div>
                    ${fileHtml}
                    <button class="${isDone ? 'btn-outline' : 'btn'}" onclick="toggleDone(${hw.id}, ${isDone})">
                        ${isDone ? 'Отменить сдачу' : '✅ Сдать работу'}
                    </button>
                </div>`;
            }
        }).join('') || '<div style="text-align:center; padding:20px; color:gray;">Заданий нет</div>';
    }

    async function deleteHW(id) {
        await supabase.from('homeworks').delete().eq('id', id);
    }

    async function toggleDone(id, isDone) {
        const { data } = await supabase.from('homeworks').select('completed_by').eq('id', id).single();
        let arr = data.completed_by || [];
        if(isDone) arr = arr.filter(n => n !== currentUser.name);
        else arr.push(currentUser.name);
        
        await supabase.from('homeworks').update({ completed_by: arr }).eq('id', id);
    }

    // Подписка на изменения (Realtime)
    function setupRealtime() {
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'homeworks' }, payload => {
                loadTasks();
            }).subscribe();
    }

    checkAutoLogin();
</script>
</body>
</html>
